{
  "acceptance_criteria": [
    {
      "id": "AC-001",
      "statement": "grok_review accepts only a regular report file confined beneath the repository root; absolute, traversal, symlink-escape, missing, and oversized reports are rejected.",
      "evidence": [
        {
          "test": "tests/test_review_evidence.py"
        }
      ]
    },
    {
      "id": "AC-002",
      "statement": "Versioned structured reports validate repository source citations against the current repository tree and exact line spans; execution probes are limited to the named architecture unsupported-schema v1 object contract, and malformed paths, spans, probe inputs, or execution records are rejected.",
      "evidence": [
        {
          "test": "tests/test_review_evidence.py"
        }
      ]
    },
    {
      "id": "AC-003",
      "statement": "Accepted review receipts bind the report content digest and validated evidence summary; evidence validation detects report deletion or content changes. Legacy prose reports are rejected for durable pass receipts.",
      "evidence": [
        {
          "test": "tests/test_review_evidence.py"
        }
      ]
    },
    {
      "id": "AC-004",
      "statement": "Command/output records are labeled self-reported and unverified; repository-local records do not claim proof of execution, reviewer identity, semantic truth, clean-clone provenance, or Trust CI authority.",
      "evidence": [
        {
          "test": "tests/test_review_evidence.py"
        }
      ]
    },
    {
      "id": "AC-005",
      "statement": "Linked revisions derive the exact changed/added claim ID set and status fields from predecessor comparison; changed claims require a different evidence payload, removals are rejected unless represented by an explicit same-ID inference retirement, and status transitions require fresh changed claims.",
      "evidence": [
        {
          "test": "tests/test_review_evidence.py"
        }
      ]
    }
  ],
