  "objective": {
    "id": "OBJ-001",
    "statement": "Make the five-media Qwen Omni capability reachable with the provisioned international-account key by adding the qwen-omni-intl profile (issue #86), and let the operator probe name the class of its own failure without opening its output (the remaining half of issue #87). Both are proven: the international omni endpoint answered 200 for a real PNG and a real WAV with image/audio token accounting, and the mainland control still answered 401 with the same key.",
    "success_metric": "HTTP 200 with finish_reason stop and prompt_tokens_details.image_tokens/audio_tokens > 0 from the international endpoint for the pinned model, and probe failure output carrying allowlisted category plus numeric http_status while never containing the credential, the exception text or the upstream body",
    "target": "main"
  },
