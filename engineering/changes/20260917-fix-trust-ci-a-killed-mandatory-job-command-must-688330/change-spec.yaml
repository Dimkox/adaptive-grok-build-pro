  "objective": {
    "id": "OBJ-001",
    "statement": "Close issue #103: a Trust CI mandatory command killed from outside was stored as an ordinary status=failed, failure_code=verification-failed, indistinguishable in the durable record from a genuine verification failure, while the strongest evidence of the kill (the process exit status, e.g. 137=128+SIGKILL, 143=128+SIGTERM, or the negative subprocess return code) sat unread inside result->commands[*].exit_code. Interpret that exit status where the exit-status conventions are already minted (trust-ci/src/adaptive_trust_ci/sandbox.py: classify_command_abort/CommandAbort) and let the runner derive the terminal cause from it: a signal-killed command records failure_code=aborted-by-signal, a command the sandbox itself deadline-killed records failure_code=aborted-by-timeout, and anything else keeps verification-failed. Source-only: the status column keeps using the frozen 001_schema.sql vocabulary, failure_code stays unconstrained text, no .sql file in the tree is changed (git diff --name-only 2f66ba6 -- '*.sql' is empty: the three trust-ci/sql/*.sql deployment files, their three packaged copies and the twenty factory resource migrations are all untouched), the already-misclassified job of PR #102 head 123ac93c is not rewritten, and the deployed Trust CI service is not updated by this commit.",
    "success_metric": "trust-ci suite 269 OK (10 postgres skips) = base 243 + 26 added. Red-before-fix by baseline: 18 of round 1's 20 on the base code; 1 of the 6 review-round tests on the round-1 code (stderr_tail totality). The rest are pins that fire only under a mutation: MU6b/MU11/MU4/MT1/MT2/MT3 KILLED, MU6 equivalent-only. ruff + compileall clean; root 759 OK. Verbatim in test-plan.md/tasks.md",
    "target": "main"
  },
