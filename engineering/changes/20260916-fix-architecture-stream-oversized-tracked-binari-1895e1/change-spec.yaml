{
  "schema_version": 2,
  "change_id": "20260916-fix-architecture-stream-oversized-tracked-binari-1895e1",
  "objective": {
    "id": "OBJ-001",
    "statement": "Analyse a tracked object larger than MAX_ANALYZED_FILE_BYTES without buffering it: the changed-artifact loop needs only size, SHA-256 and a binary marker, so those are computed from a bounded stream while an oversized *text* object still refuses analysis and an explicit content request still raises the existing limit. This removes the false local red that issue #80 records on every release artifact-child pull request.",
    "success_metric": "diff_architecture(base_sha=release-sync merge, worktree=True) over a tree containing the 10,940,676-byte tracked v2.0.17 ZIP returns an added artifact whose head_size and head_digest equal the buffered sha256, instead of raising 'worktree file exceeds analysis limit'",
    "target": "main"
  },
  "risk": {
    "tier": "yellow",
    "domains": [
      "verification",
      "test-infra",
      "architecture"
    ]
  },
  "acceptance_criteria": [
    {
      "id": "AC-001",
      "statement": "An oversized tracked binary no longer aborts architecture analysis: both the commit-mode and worktree-mode diff produce an added artifact carrying the real size, the streaming SHA-256 equal to the buffered digest, and None line counts, matching how _line_stats already treats binary content.",
      "evidence": [
        {
          "test": "tests/test_architecture_fitness.py"
        }
      ]
    },
    {
      "id": "AC-002",
      "statement": "No memory bound is widened: MAX_ANALYZED_FILE_BYTES (10,000,000), MAX_GIT_OUTPUT_BYTES (20,000,000) and MAX_DIFF_ARTIFACT_BYTES (50,000,000) are asserted by value, oversized text still raises 'exceeds analysis limit' in both diff modes, and an oversized object still appears in artifacts and in the aggregate byte accounting, so size cannot buy either silence or an uncounted entry.",
      "evidence": [
        {
          "test": "tests/test_architecture_fitness.py"
        },
        {
          "test": "tests/test_architecture_fitness.py"
        }
      ]
    },
    {
      "id": "AC-003",
      "statement": "Explicit content reads are unchanged: read_diff_file/read_diff_files still refuse an oversized path, so a caller that needs bytes cannot receive a silently truncated or streamed substitute.",
      "evidence": [
        {
          "test": "tests/test_architecture_fitness.py"
        }
      ]
    },
    {
      "id": "AC-004",
      "statement": "Identity and no-follow discipline survive the refactor: the worktree walk stays O_NOFOLLOW per component, non-regular files and symlinks still raise, a vanished file still yields None, and a file whose dev/ino/size/mtime change during streaming still raises.",
      "evidence": [
        {
          "test": "tests/test_architecture_fitness.py"
        },
        {
          "receipt": "code_review"
        }
      ]
    }
  ],
  "invariants": [
    {
      "id": "INV-001",
      "statement": "The public ChangedArtifact contract is unchanged in type and meaning; every path at or below the analysis limit produces byte-identical size, digest and line counts to the pre-fix implementation.",
      "evidence": [
        {
          "test": "tests/test_architecture_fitness.py"
        }
      ]
    },
    {
      "id": "INV-002",
      "statement": "The second process site obeys the module's existing bounded-execution discipline: argument vector with shell=False, restricted environment, selectors deadline, capped stderr, a size ceiling, and _stop_process (group kill and reap) on every failure path; the object id is _EXACT_SHA-validated before it reaches argv.",
      "evidence": [
        {
          "receipt": "security_review"
        }
      ]
    }
  ],
  "forbidden_outcomes": [
    {
      "id": "FORBID-001",
      "statement": "Raising or removing MAX_ANALYZED_FILE_BYTES, or skipping the digest of an oversized file, to make a check pass; silence must never be bought with a wider limit.",
      "evidence": [
