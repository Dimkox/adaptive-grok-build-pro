  "objective": {
    "id": "OBJ-001",
    "statement": "Fix issue #155: guards inside the semantic_bind_repair_child PostgreSQL function return a bare NULL, so bind_repair_child cannot distinguish a deadline or precondition rejection from a malformed payload and surfaces a misleading invalid_object ContractError; the mandatory disposable-exit PostgreSQL evidence run consequently flakes about one run in three under host load. Give each guard a machine-readable rejection reason or a distinct SQLSTATE, map it to typed StoreError reason codes while keeping invalid_object for genuinely malformed payloads, keep shipped migration history immutable by replacing the function in a new versioned resource, and make the affected integration fixture independent of wall-clock scheduling. Do not weaken the contract schema, the evidence gate, or the disposable-exit run.",
    "success_metric": "Four consecutive mandatory disposable-exit PostgreSQL tier runs, every bind rejection carrying one of the twelve named reasons, and no rejection path reachable only as invalid_object",
    "target": "adaptive-grok-build-pro main: factory/src/adaptive_factory/resources/021_semantic_repair_child_rejection_reasons.sql, the bind_repair_child mapping in factory/src/adaptive_factory/store.py plus its reason allowlist in semantic_repair.py, and the PostgreSQL-tier fixtures that stamp authority and child deadlines"
  },
