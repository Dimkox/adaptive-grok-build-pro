  "objective": {
    "id": "OBJ-001",
    "statement": "Close issue 205: classify the changed-path inventory before verification so a documentation/dated-state/lockstep-test-only successor runs the disclosed focused lockstep profile instead of the full coverage suite, while any executed-behavior, schema/contract, Trust CI, workflow or package-tooling change keeps the full PR suite.",
