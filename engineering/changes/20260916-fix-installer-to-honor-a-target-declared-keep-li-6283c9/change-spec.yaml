  "objective": {
    "id": "OBJ-001",
    "statement": "Close issue #110: the installer cannot express consumer-kept files, so refreshing the stack silently overwrites target policy (.coveragerc, bandit.yaml, .grok-stack/config/routing.json). Add a target-declared keep list: read optional .grok-stack/AGBP_SYNC.json ({schema_version:1, kept_local:[paths]}), report each declared managed path in the plan as KEEP <path> (declared by target) with state absent|identical|target-owned|unmanaged, exclude kept paths from the delivered payload, and fail the plan naming any kept path whose target bytes differ from the stack content. Validate the record closed (unknown keys/versions, non-string, absolute, traversal, non-canonical, duplicate entries fail), read it and every kept path no-follow with size caps, absent directories mean absent files. Targets without a record plan exactly as before.",
    "success_metric": "tests.test_installer 24 OK (17 pre-existing + 7 keep arms incl. conflict, drift immutability, symlinked record, no-record regression); existing installer suite passes unchanged",
    "target": "main"
  },
