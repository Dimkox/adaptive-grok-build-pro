    {"id":"AC-002","statement":"A valid current leased-run V2 result is committed atomically with its command record and returns the exact digest with created=true and outbox_created=false; any failure rolls back all result and command mutations.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"verification"}]},
    {"id":"AC-003","statement":"The same actor, idempotency key and canonical request replays as created=false even after authority expiry, while changed command content or changed envelope for one natural source identity returns a stable conflict and preserves the original record.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"test_review"}]},
    {"id":"AC-004","statement":"Concurrent identical admissions produce exactly one created result, and concurrent competing envelopes for one natural identity produce one winner and one conflict without duplicate rows or an unbounded wait.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"data_review"}]},
    {"id":"AC-005","statement":"Repository, task, run, attempt, owner, fence, packet, active-state, lease and deadline bindings fail closed; stale or late results cannot mutate a newer run.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"code_review"}]},
    {"id":"AC-006","statement":"PostgreSQL revalidates the closed canonical V2 and command shapes, digests, channel/content rules, payload structure, bounds and secret controls so direct function execution cannot bypass the hardened Python contract.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"test":"factory/tests/test_result_broker.py"},{"receipt":"data_review"}]},
    {"id":"AC-007","statement":"Committed results survive a real disposable PostgreSQL restart and exact replay remains stable afterward; retrieval binds repository_id, task_id and envelope digest and cross-repository access is indistinguishable from not found.","evidence":[{"test":"factory/tests/test_execution_persistence_postgres.py"},{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"test_review"}]},
