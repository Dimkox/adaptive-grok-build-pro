  "objective": {
    "id": "OBJ-001",
    "statement": "Fix issue #147: the comparator resolves a declared $id before the declared-path table, so a contract declaring an $id equal to another contract's path captures that referrer's references and a real consumer-breaking narrowing of the captured target reports compatible instead of incompatible (narrowed_constraint). Reference identity must resolve through the declared-path table whenever the reference names a declared path, and the architecture model must reject a declared $id that equals another contract's path with a named error. Issue-only scope: do not change comparator verdict semantics for correctly-declared inventories, do not touch compatibility policy or contracts, and keep #148 (signal volume) for its own wave.",
