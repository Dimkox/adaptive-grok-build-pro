    {"id":"AC-003","statement":"Concurrent bounded SKIP LOCKED claims give one owner/token/lease per row, and claim/start/record reject stale owners, tokens, leases, non-current run/fence/packet or closed attempt authority.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"code_review"}]},
    {"id":"AC-004","statement":"A pre-send lease expiry may return to pending; once sending begins, timeout, disconnect, crash or unbound response becomes unknown and every restart performs observation GET for the same deterministic operation without a second POST.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"test":"factory/tests/test_execution_persistence_postgres.py"},{"receipt":"test_review"}]},
    {"id":"AC-005","statement":"Delivered or proved-failed state requires a closed bounded response with JSON content type and exact operation, request, envelope and postcondition bindings; transport ACK, redirects, authentication failures, 5xx, malformed, duplicate-key, oversized or mismatched responses remain ambiguous and never assert business success.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"code_review"}]},
    {"id":"AC-006","statement":"Send and observation attempts/deadlines are finite and persisted; exhaustion becomes blocked/unknown without retry reset, blind repost, provider failover or false failure, and restart preserves all counters and operation identity.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"test":"factory/tests/test_execution_persistence_postgres.py"},{"receipt":"data_review"}]},
    {"id":"AC-007","statement":"Dispatcher is false by default and enabling requires its separate database URL, private no-follow token file, one absolute normalized same-UID mode-0600 Unix socket with trusted non-writable ancestry, bounded response/poll/batch/timeout, and lease duration greater than timeout plus processing margin; TCP, DNS, proxy, redirect and arbitrary URL paths are unavailable.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"code_review"}]},
    {"id":"AC-008","statement":"Only the provisioned dispatcher login can assume the NOLOGIN/NOINHERIT capability and execute claim/start/record/reconcile; factory_runtime and PUBLIC cannot execute them or mutate outbox state, and dispatcher cannot use unrelated runtime mutation APIs.","evidence":[{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"data_review"}]},
    {"id":"AC-009","statement":"PR235 admission, retrieval, structured payload defenses and exact replay remain unchanged and always return outbox_created=false; tests may seed an internally consistent already-admitted row only as an explicit test fixture.","evidence":[{"test":"factory/tests/test_result_admission_api.py"},{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"verification"}]},
    {"id":"AC-010","statement":"A versioned closed internal UDS handoff/observation contract and qualification-v2 contract remain additive; all seven channels stay unavailable, and no receiver/provider/model invocation, live interception, BB/FPF/VibeVM activation, U4/macOS work or production qualification is claimed.","evidence":[{"test":"tests/test_factory_v15_result_schema.py"},{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"code_review"}]},
