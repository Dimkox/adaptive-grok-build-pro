    {"id":"AC-001","statement":"Additive migration 025 upgrades hardened migration 024 exactly once, requires the pre-qualification outbox to be empty or fails closed, adds only bounded dispatch metadata/functions/indexes and an isolated dispatcher capability role, and performs no trigger, backfill or automatic enqueue.","evidence":[{"test":"factory/tests/test_migrations.py"},{"test":"factory/tests/test_postgres_integration.py"},{"receipt":"data_review"}]},
