  "objective": {
    "id": "OBJ-001",
    "statement": "Close issue #109 (a real defect #101 shipped): _stream_git_blob leaked its git cat-file child on any exception the handlers do not name (the finally closed pipes but never stopped the process) and surfaced selector-setup failures as a raw traceback instead of the ArchitectureError(code=io) contract its sibling _run_capped already honors; _profile_worktree_blob's unguarded two-close finally could leak the directory fd behind a failing descriptor close. Fix: typed setup wrapper mirroring _run_capped, unconditional child-stop guard in the streaming finally (poll() is None -> _stop_process), nested guard on the worktree close pair, and three regression arms that fail on the pre-fix code, including a live sleep-child poll assertion. The issue text's own mistaken 'os.name dispatch' claim is publicly corrected on the issue before merging (verified: no platform branch exists in this module; the shared selector usage is the real gap).",
