      "statement": "An operator-scoped landing Unix-socket request creates a durable probe_id in pending state before the server initiates exactly one synthetic provider probe; retries for that ID return its current/final record and never dispatch another provider call.",
      "evidence": [
        {
          "test": "factory/tests/test_landing_server.py"
        },
        {
          "test": "factory/tests/test_landing_activation_probe.py"
        }
      ]
    },
    {
      "id": "AC-002",
      "statement": "The probe result is stored in a dedicated append-only table in the existing landing SQLite database, with profile/model identity and digest, synthetic input/spec/response digests, normalized terminal state or allowlisted failure category/status, usage, elapsed time, provider request attempts and timestamps; no key, raw prompt/response or provider body is stored.",
      "evidence": [
        {
          "test": "factory/tests/test_landing_sqlite_store.py"
        },
        {
          "test": "factory/tests/test_landing_activation_probe.py"
        }
      ]
