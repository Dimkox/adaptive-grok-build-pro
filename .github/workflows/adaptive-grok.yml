name: adaptive-grok

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Doctor
        run: python scripts/grok_doctor.py
      - name: Verify
        run: python scripts/grok_verify.py --mode pr

  package:
    needs: verify
    if: hashFiles('scripts/package_stack.py') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package
        run: python scripts/package_stack.py
      - name: Upload dist zips
        uses: actions/upload-artifact@v4
        with:
          name: dist-zips
          path: dist/*.zip*
