name: protected-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from the VERSION file, without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: protected-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact main SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install authoritative verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.16.2
          bandit==1.9.4
          coverage==7.15.4
          tomli==2.4.1

      - name: Validate release identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual_version="$(tr -d '\r\n' < VERSION)"
          test -n "$actual_version"
          if [[ "$REQUESTED_VERSION" != "$actual_version" ]]; then
            echo "Requested $REQUESTED_VERSION but VERSION is $actual_version" >&2
            exit 1
          fi
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/v${actual_version}"; then
            echo "Tag v${actual_version} already exists" >&2
            exit 1
          fi

      - name: Run strict release verification
        run: python3 scripts/grok_verify.py --mode release --strict --json

      - name: Build deterministic release package
        run: python3 scripts/package_stack.py

      - name: Tag and publish the verified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="dist/adaptive-grok-build-pro-v${REQUESTED_VERSION}.zip"
          checksum="${archive}.sha256"
          test -f "$archive"
          test -f "$checksum"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${REQUESTED_VERSION}" "$GITHUB_SHA" -m "v${REQUESTED_VERSION}"
          git push origin "v${REQUESTED_VERSION}"
          gh release create "v${REQUESTED_VERSION}" \
            "$archive" \
            "$checksum" \
            --verify-tag \
            --title "Adaptive Grok Build Pro v${REQUESTED_VERSION}" \
            --generate-notes
