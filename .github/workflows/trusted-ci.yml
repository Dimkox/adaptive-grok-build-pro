name: trusted-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: trusted-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out exact event SHA with comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install authoritative verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.16.2
          bandit==1.9.4
          coverage==7.15.4
          tomli==2.4.1

      - name: Run strict verification against the event base
        env:
          VERIFY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$VERIFY_BASE" || "$VERIFY_BASE" =~ ^0+$ ]]; then
            VERIFY_BASE="$(git rev-parse "$GITHUB_SHA^")"
          fi
          python3 scripts/grok_verify.py --mode pr --strict --json --base "$VERIFY_BASE"

  package:
    name: package
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact event SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build deterministic package
        run: python3 scripts/package_stack.py
