services:
  postgres-test:
    image: ${TRUST_CI_POSTGRES_IMAGE:?set immutable postgres image name@sha256 digest}
    environment:
      POSTGRES_DB: trust_ci_test
      POSTGRES_USER: trust_ci_admin_test
      POSTGRES_PASSWORD: trust_ci_admin_test_password
      TRUST_CI_API_DB_PASSWORD: trust_ci_api_test_password
      TRUST_CI_WORKER_DB_PASSWORD: trust_ci_worker_test_password
      TRUST_CI_MIGRATOR_DB_PASSWORD: trust_ci_migrator_test_password
      TRUST_CI_BACKUP_DB_PASSWORD: trust_ci_backup_test_password
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - trust-ci-pgtest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust_ci_admin_test -d trust_ci_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - trust-ci-test

  postgres-integration:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        PYTHON_BASE_IMAGE: ${TRUST_CI_PYTHON_BASE_IMAGE:?set immutable Python base image name@sha256 digest}
    image: ${TRUST_CI_TEST_BUILD_TAG:-adaptive-trust-ci-test:2.1.0}
    environment:
      TRUST_CI_TEST_DATABASE_URL: postgresql://trust_ci_migrator:trust_ci_migrator_test_password@postgres-test:5432/trust_ci_test
      TRUST_CI_TEST_API_DATABASE_URL: postgresql://trust_ci_api:trust_ci_api_test_password@postgres-test:5432/trust_ci_test
      TRUST_CI_TEST_WORKER_DATABASE_URL: postgresql://trust_ci_worker:trust_ci_worker_test_password@postgres-test:5432/trust_ci_test
      TRUST_CI_TEST_BACKUP_DATABASE_URL: postgresql://trust_ci_backup:trust_ci_backup_test_password@postgres-test:5432/trust_ci_test
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_postgres_integration.py", "-v"]
    networks:
      - trust-ci-test

volumes:
  trust-ci-pgtest-data:

networks:
  trust-ci-test:
    driver: bridge
