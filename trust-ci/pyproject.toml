[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-trust-ci"
version = "2.1.0"
description = "Independent exact-SHA CI trust boundary for Adaptive Grok Build Pro"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography==46.0.4",
  "fastapi==0.128.2",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
adaptive-trust-ci = "adaptive_trust_ci.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_trust_ci = ["resources/*.sql"]
