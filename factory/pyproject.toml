[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "psycopg[binary]==3.3.4"]

[project.scripts]
adaptive-factory = "adaptive_factory.cli:main"

[tool.setuptools.package-data]
adaptive_factory = ["resources/*.sql"]
