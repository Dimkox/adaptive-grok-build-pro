services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${FACTORY_POSTGRES_DB:?set FACTORY_POSTGRES_DB}
      POSTGRES_USER: ${FACTORY_POSTGRES_USER:?set FACTORY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FACTORY_POSTGRES_PASSWORD:?set FACTORY_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${FACTORY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - factory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  factory-postgres: {}
